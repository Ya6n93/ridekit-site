# FAQ de l'accueil (et son FAQPage). Chaque réponse dit ce que fait l'app aujourd'hui.
- q: "RideKit est-elle gratuite ?"
  a: "Oui. Le guidage vocal, le Roadbook, la météo, le prix de l'essence, l'import GPX, le partage en image et les sorties de groupe à 2 sont gratuits, avec 3 boucles générées par mois. RideKit Pro (49,99 € par an avec 7 jours d'essai, ou 5,99 € par mois) ajoute la détection de chute, le Copilote vocal, les boucles illimitées, les cartes hors ligne, les groupes jusqu'à 8 et l'export GPX."
- q: "Sur quels téléphones ?"
  a: "Sur iPhone, bientôt sur l'App Store en France. L'app est en français. Une version Android viendra plus tard."
- q: "Faut-il créer un compte ?"
  a: "Non. Tes balades, ta moto et tes réglages restent sur ton téléphone. Une sortie de groupe se rejoint avec un code, sans compte ni numéro."
- q: "La détection de chute appelle-t-elle les secours ?"
  a: "Non. Avec RideKit Pro, après une chute probable et sans réponse de ta part, elle envoie un SMS avec ta position à ton contact d'urgence. C'est une aide, pas une garantie : elle peut rater une chute ou se déclencher à tort. En cas d'urgence, appelle le 112. [En savoir plus](/detection-chute-moto/)."
- q: "RideKit affiche-t-elle les radars ?"
  a: "Non. En France, elle signale les zones de danger, comme les autres aides à la conduite autorisées (une portion de 300 m en ville, 2 km hors agglomération, 4 km sur autoroute), à partir de la liste officielle des radars fixes, sans jamais montrer l'emplacement d'un radar."
- q: "Est-ce que ça marche sans réseau ?"
  a: "Le guidage a besoin de la carte : avec RideKit Pro, télécharge la carte d'une balade ou d'un road trip avant de partir, et le guidage continue là où ça ne capte plus."
- q: "Puis-je suivre mes propres traces GPX ?"
  a: "Oui, gratuitement : RideKit importe les fichiers GPX, KML, KMZ et TCX et te guide dessus, dans un sens ou dans l'autre. L'export en GPX est inclus dans RideKit Pro. [Le guide GPX](/gpx-moto/)."
